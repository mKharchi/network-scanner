services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: network-scanner-server
    command: python -u server.py
    ports:
      - "5000:5000"
    stdin_open: true  # Required to interact with the server menu
    tty: true         # Required to interact with the server menu

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: network-scanner-client
    command: python -u client.py
    
    # Run the client in the host's PID and Network namespaces 
    # so that it can actually scan the host PC's processes and network.
    network_mode: "host"
    pid: "host"
    
    env_file:
      - .env

    volumes:
      # Mount host logs and config directories so activity logs actually read the host's browser history/syslog
      - /var/log:/var/log:ro
      - ~/.config:/root/.config:ro
      - ~/.mozilla:/root/.mozilla:ro
      - ~/.local/share:/root/.local/share:ro
      - ~/.bash_history:/root/.bash_history:ro
      - ~/.zsh_history:/root/.zsh_history:ro

    depends_on:
      - server
    restart: unless-stopped